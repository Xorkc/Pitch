<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pitch">
<meta name="theme-color" content="#D6D3C8">
<title>Pitch</title>
<style>
  :root{
    --panel:#D6D3C8;
    --panel-2:#C7C4B8;
    --ink:#1E2019;
    --ink-soft:#5D6156;
    --well:#262A24;
    --trace:#E8E4D8;
    --live:#C6432D;
    --lock:#31663C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--panel);color:var(--ink)}
  body{
    font-family:"Avenir Next Condensed","Avenir Next","Helvetica Neue",system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 14px);
    max-width:560px;margin:0 auto;
    touch-action:manipulation;
  }

  .strip{
    display:flex;align-items:center;gap:9px;
    padding:14px 0 10px;
    border-bottom:1px solid var(--ink);
    font-size:14px;letter-spacing:.02em;
  }
  .lamp{width:9px;height:9px;border-radius:50%;background:transparent;border:1px solid var(--ink-soft);flex:none}
  .lamp.on{background:var(--live);border-color:var(--live)}
  #status{flex:1;color:var(--ink-soft)}
  .ref{display:flex;align-items:center;gap:2px}
  .ref button{
    font:inherit;font-size:17px;line-height:1;
    width:26px;height:26px;border:1px solid var(--ink-soft);background:transparent;
    color:var(--ink);border-radius:2px;padding:0;
  }
  .ref button:active{background:var(--ink);color:var(--panel)}
  #refVal{min-width:62px;text-align:center;font-size:14px}

  .readout{padding:22px 0 6px}
  .glyph{display:flex;align-items:baseline;gap:6px;line-height:.82}
  #note{font-size:118px;font-weight:600;letter-spacing:-.02em;display:block}
  #note.idle{color:var(--ink-soft);font-weight:400}
  #oct{font-size:34px;font-weight:400;color:var(--ink-soft);align-self:flex-end;position:relative;top:-6px}

  .meter{position:relative;height:46px;margin:18px 0 8px;border-top:1px solid var(--ink)}
  .ticks{position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,var(--ink-soft) 0 1px,transparent 1px 10%);
    height:9px;opacity:.55}
  .zero{position:absolute;left:50%;top:0;width:1px;height:20px;background:var(--ink);transform:translateX(-.5px)}
  .needle{position:absolute;top:0;left:50%;width:3px;height:34px;
    background:var(--live);transform:translateX(-1.5px);
    transition:left .07s linear,background .15s;will-change:left}
  .needle.lock{background:var(--lock)}
  .needle.off{opacity:0}
  #cents{position:absolute;bottom:0;left:0;font-size:15px;color:var(--ink-soft)}
  #cents.lock{color:var(--lock)}

  .freqrow{display:flex;align-items:baseline;gap:7px;
    padding:12px 0 14px;border-top:1px solid var(--ink)}
  #freq{font-size:40px;font-weight:500;letter-spacing:.01em}
  .unit{font-size:16px;color:var(--ink-soft)}
  .level{margin-left:auto;width:66px;height:4px;background:var(--panel-2);align-self:center}
  .level{position:relative}
  .level i{display:block;height:100%;width:0;background:var(--ink);transition:width .08s linear}
  .level b{position:absolute;top:-4px;width:1px;height:12px;background:var(--live);left:0}

  .well{background:var(--well);height:132px;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:132px}

  .modes{display:flex;gap:0;padding:12px 0 2px}
  .modes button{
    font:inherit;font-size:14px;padding:8px 16px;
    border:1px solid var(--ink);background:transparent;color:var(--ink);
    border-radius:0;margin-left:-1px;
  }
  .modes button:first-child{margin-left:0}
  .modes button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
  .sens{display:flex;align-items:center;gap:12px;padding:12px 0 10px}
  .sens label{font-size:13px;color:var(--ink-soft);flex:none}
  .sens input{
    -webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;margin:0;
  }
  .sens input::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  .sens input::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:2px;
    background:var(--ink);margin-top:-10px;
  }
  #sensVal{font-size:13px;color:var(--ink-soft);width:52px;text-align:right;flex:none}

  .heard{display:flex;gap:10px;align-items:flex-start;
    padding:13px 0 4px;min-height:52px;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .heard span.tag{font-size:13px;color:var(--ink-soft);flex:none;width:38px;padding-top:2px}
  #heard{display:flex;flex-wrap:wrap;gap:5px 9px;font-size:17px}
  #heard b{font-weight:500}
  #heard b:last-child{color:var(--live)}
  .heard em{font-style:normal;font-size:14px;color:var(--ink-soft);padding-top:3px}

  #power{display:block;width:100%;margin-top:20px;
    font:inherit;font-size:19px;font-weight:600;letter-spacing:.03em;
    padding:16px;border:none;border-radius:2px;
    background:var(--ink);color:var(--panel)}
  #power:active{background:var(--live)}
  #power.on{background:transparent;color:var(--ink);border:1px solid var(--ink);font-weight:500}

  .ver{font-size:11px;color:var(--ink-soft);opacity:.7;padding-top:14px}
  #err{font-size:14px;line-height:1.45;color:var(--live);margin:12px 0 0;max-width:44em}
  #err:empty{display:none}

  @media (prefers-reduced-motion:reduce){.needle{transition:none}}
</style>
</head>
<body>

<div class="strip">
  <span class="lamp" id="lamp"></span>
  <span id="status">Microphone off</span>
  <span class="ref">
    <button id="refDown" aria-label="Lower reference pitch">–</button>
    <span id="refVal">A 440</span>
    <button id="refUp" aria-label="Raise reference pitch">+</button>
  </span>
</div>

<div class="readout">
  <div class="glyph"><span id="note" class="idle">—</span><sup id="oct"></sup></div>
  <div class="meter">
    <div class="ticks"></div>
    <div class="zero"></div>
    <div class="needle off" id="needle"></div>
    <div id="cents">play one note</div>
  </div>
</div>

<div class="freqrow">
  <span id="freq">———.——</span><span class="unit">Hz</span>
  <span class="level"><i id="level"></i><b id="gateMark"></b></span>
</div>

<div class="well"><canvas id="scope"></canvas></div>

<div class="modes">
  <button id="mGuitar" aria-pressed="true">Guitar</button>
  <button id="mWide" aria-pressed="false">Wide</button>
</div>

<div class="sens">
  <label for="sens">Sensitivity</label>
  <input type="range" id="sens" min="0" max="10" step="1" value="7">
  <span id="sensVal">high</span>
</div>

<div class="heard">
  <span class="tag">heard</span>
  <div id="heard"></div>
  <em id="heardEmpty">nothing yet</em>
</div>

<button id="power">Start listening</button>
<p id="err"></p>
<div class="ver">v4 · 2200 Hz spectrum check</div>

<script>
(function(){
  const NOTES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const el=id=>document.getElementById(id);
  const noteEl=el('note'),octEl=el('oct'),centsEl=el('cents'),needle=el('needle'),
        freqEl=el('freq'),levelEl=el('level'),statusEl=el('status'),lamp=el('lamp'),
        power=el('power'),errEl=el('err'),heardEl=el('heard'),heardEmpty=el('heardEmpty'),
        refVal=el('refVal'),canvas=el('scope'),sens=el('sens'),sensVal=el('sensVal');
  const ctx2d=canvas.getContext('2d');

  let lpNode=null;
  let A4=440, running=false, audio=null, analyser=null, stream=null,
      timeBuf=null, lastDetect=0, rafId=0,
      history=[], stableMidi=null, stableCount=0, logged=[], smoothCents=0,
      holdUntil=0, sounding=false, peakEnv=0.02;

  /* noise gate, driven by the sensitivity slider.
     0 = 0.010 (loud room, voice only) … 10 = 0.0004 (unplugged electric across the room) */
  function gateFor(v){ return 0.020*Math.pow(0.06,v/10); }
  let gate=gateFor(7);
  const SENS_WORDS=['lowest','','low','','','medium','','high','','','highest'];
  function updateSens(){
    gate=gateFor(+sens.value);
    sensVal.textContent=SENS_WORDS[+sens.value]||(+sens.value>7?'higher':'lower');
    const gm=document.getElementById('gateMark');
    if(gm) gm.style.left=Math.max(0,Math.min(100,(20*Math.log10(gate)+72)/72*100))+'%';
  }
  sens.addEventListener('input',updateSens);
  updateSens();

  const WINDOW=4096;
  let nsdf=new Float32Array(2400);
  let freqBuf=null;
  const MODES={guitar:{lo:70,hi:700,lp:1100},wide:{lo:62,hi:2200,lp:2600}};
  let mode='guitar';

  function detect(buf,sr,thresh,clarityFloor){
    let rms=0,mean=0;
    for(let i=0;i<WINDOW;i++) mean+=buf[i];
    mean/=WINDOW;
    for(let i=0;i<WINDOW;i++){const v=buf[i]-mean;buf[i]=v;rms+=v*v;}
    rms=Math.sqrt(rms/WINDOW);
    if(rms<thresh) return {rms:rms};

    const maxLag=Math.min(Math.floor(sr/MODES[mode].lo),WINDOW>>1);
    if(nsdf.length<maxLag+2) nsdf=new Float32Array(maxLag+2);

    for(let tau=1;tau<=maxLag;tau++){
      let ac=0,m=0;
      const n=WINDOW-tau;
      for(let i=0;i<n;i++){const a=buf[i],b=buf[i+tau];ac+=a*b;m+=a*a+b*b;}
      nsdf[tau]=m>0?2*ac/m:0;
    }

    let tau=1;
    while(tau<=maxLag&&nsdf[tau]>0) tau++;
    const minLag=Math.max(2,Math.floor(sr/MODES[mode].hi));
    const maxima=[];let best=-1;
    while(tau<=maxLag){
      if(nsdf[tau]>0){
        let pT=tau,pV=nsdf[tau];
        while(tau<=maxLag&&nsdf[tau]>0){if(nsdf[tau]>pV){pV=nsdf[tau];pT=tau;}tau++;}
        if(pT>=minLag){maxima.push([pT,pV]);if(pV>best)best=pV;}
      } else tau++;
    }
    if(!maxima.length||best<clarityFloor) return {rms:rms};

    const t2=best*0.9;
    let pick=maxima[0];
    for(const m of maxima){if(m[1]>=t2){pick=m;break;}}

    const t=pick[0];
    const y1=nsdf[t-1]||0,y2=nsdf[t],y3=nsdf[t+1]||0;
    const den=2*(2*y2-y1-y3);
    const shift=den!==0?(y3-y1)/den:0;
    const period=t+Math.max(-1,Math.min(1,shift));
    const f=sr/period;
    if(!isFinite(f)||f<MODES[mode].lo-4||f>MODES[mode].hi+40) return {rms:rms};
    return {rms:rms,freq:correctOctave(f,sr),clarity:y2};
  }

  /* an unplugged electric puts more energy in the harmonics than the fundamental,
     so the raw pitch is often 2x or 3x too high. Check the spectrum underneath it. */
  function magAt(f,sr){
    if(!freqBuf) return -Infinity;
    const binHz=sr/(freqBuf.length*2);
    const b=f/binHz;
    let m=-Infinity;
    for(let i=Math.max(0,Math.round(b)-2);i<=Math.round(b)+2&&i<freqBuf.length;i++){
      if(freqBuf[i]>m) m=freqBuf[i];
    }
    return m;
  }
  function correctOctave(f,sr){
    const lo=MODES[mode].lo;
    for(let pass=0;pass<2;pass++){
      let moved=false;
      for(const d of [3,2]){
        const c=f/d;
        if(c>=lo&&magAt(c,sr)>magAt(f,sr)-12){f=c;moved=true;break;}
      }
      if(!moved) break;
    }
    return f;
  }

  function show(f){
    const midiF=12*Math.log2(f/A4)+69;
    const midi=Math.round(midiF);
    const cents=Math.round((midiF-midi)*100);
    const name=NOTES[((midi%12)+12)%12];
    const octave=Math.floor(midi/12)-1;

    noteEl.textContent=name;
    noteEl.classList.remove('idle');
    octEl.textContent=octave;
    freqEl.textContent=f.toFixed(2);

    smoothCents=smoothCents*0.55+cents*0.45;
    const c=Math.max(-50,Math.min(50,smoothCents));
    needle.classList.remove('off');
    needle.style.left=(50+c)+'%';

    const inTune=Math.abs(cents)<=4;
    needle.classList.toggle('lock',inTune);
    centsEl.classList.toggle('lock',inTune);
    centsEl.textContent=inTune?'in tune':(cents>0?'+':'−')+Math.abs(cents)+' cents';

    if(midi===stableMidi){stableCount++;}else{stableMidi=midi;stableCount=1;}
    if(stableCount===4&&logged[logged.length-1]!==name+octave){
      logged.push(name+octave);
      if(logged.length>28) logged.shift();
      heardEl.innerHTML=logged.map(n=>'<b>'+n+'</b>').join('');
      heardEmpty.style.display='none';
    }
    holdUntil=performance.now()+1100;
  }

  function idle(){
    if(performance.now()<holdUntil) return;
    noteEl.textContent='—';noteEl.classList.add('idle');
    octEl.textContent='';
    freqEl.textContent='———.——';
    centsEl.textContent='play one note';
    centsEl.classList.remove('lock');
    needle.classList.add('off');
    stableMidi=null;stableCount=0;
  }

  function sizeCanvas(){
    const r=Math.min(window.devicePixelRatio||1,2);
    canvas.width=canvas.clientWidth*r;
    canvas.height=canvas.clientHeight*r;
    ctx2d.setTransform(r,0,0,r,0,0);
  }
  window.addEventListener('resize',sizeCanvas);

  function drawScope(buf){
    const w=canvas.clientWidth,h=canvas.clientHeight,mid=h/2;
    ctx2d.clearRect(0,0,w,h);
    ctx2d.strokeStyle='rgba(232,228,216,.18)';ctx2d.lineWidth=1;
    ctx2d.beginPath();ctx2d.moveTo(0,mid);ctx2d.lineTo(w,mid);ctx2d.stroke();

    // track a decaying peak so a quiet signal still fills the window
    let peak=0;
    for(let i=0;i<buf.length;i++){const a=Math.abs(buf[i]);if(a>peak)peak=a;}
    peakEnv=peak>peakEnv?peak:peakEnv*0.94+peak*0.06;
    const scale=1/Math.max(peakEnv,gate*3.5);

    let start=0;
    for(let i=1;i<buf.length/2;i++){
      if(buf[i-1]<=0&&buf[i]>0){start=i;break;}
    }
    const span=Math.floor(buf.length/2);
    ctx2d.strokeStyle='#E8E4D8';ctx2d.lineWidth=1.6;ctx2d.lineJoin='round';
    ctx2d.beginPath();
    for(let i=0;i<span;i++){
      const v=(buf[start+i]||0)*scale;
      const x=i/span*w;
      const y=mid-Math.max(-1,Math.min(1,v))*mid*0.86;
      i?ctx2d.lineTo(x,y):ctx2d.moveTo(x,y);
    }
    ctx2d.stroke();
  }

  function loop(){
    rafId=requestAnimationFrame(loop);
    if(!analyser) return;
    analyser.getFloatTimeDomainData(timeBuf);
    drawScope(timeBuf);
    analyser.getFloatFrequencyData(freqBuf);

    const now=performance.now();
    if(now-lastDetect<70) return;
    lastDetect=now;

    const work=timeBuf.slice(0,WINDOW);
    // hysteresis: once a note is sounding, follow it down through its decay
    const r=detect(work,audio.sampleRate,sounding?gate*0.6:gate,sounding?0.48:0.62);

    const db=20*Math.log10(Math.max(r.rms,1e-6));
    levelEl.style.width=Math.max(0,Math.min(100,(db+72)/72*100))+'%';

    if(r.freq){
      history.push(r.freq);
      if(history.length>4) history.shift();
      const sorted=history.slice().sort((a,b)=>a-b);
      const med=sorted[Math.floor(sorted.length/2)];
      let agree=0;
      for(const f of history){ if(Math.abs(1200*Math.log2(f/med))<60) agree++; }
      if(history.length>=3&&agree>=3){ sounding=true; show(med); }
      else { idle(); }
    } else {
      sounding=false;
      history.length=0;
      idle();
    }
  }

  async function start(){
    errEl.textContent='';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      errEl.textContent='This browser will not hand over the microphone here. That normally means the page is not on a secure address — open it over https:// and try again.';
      return;
    }
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{
        echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1
      }});
    }catch(e){
      if(e.name==='NotAllowedError'){
        errEl.textContent='Microphone access was blocked. In Safari, tap “aA” in the address bar → Website Settings → Microphone → Allow, then reload.';
      }else if(e.name==='NotFoundError'){
        errEl.textContent='No microphone found on this device.';
      }else{
        errEl.textContent='Could not open the microphone ('+e.name+'). If this page is embedded in another app, open it directly in Safari instead.';
      }
      return;
    }

    audio=new (window.AudioContext||window.webkitAudioContext)();
    await audio.resume();
    const src=audio.createMediaStreamSource(stream);

    // clear the rumble below the lowest string and the hiss above the harmonics
    const hp=audio.createBiquadFilter();
    hp.type='highpass';hp.frequency.value=62;hp.Q.value=0.7;
    const lp=audio.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=2200;lp.Q.value=0.7;
    const gain=audio.createGain();
    gain.gain.value=1;

    analyser=audio.createAnalyser();
    analyser.fftSize=4096;
    analyser.smoothingTimeConstant=0;
    timeBuf=new Float32Array(analyser.fftSize);
    freqBuf=new Float32Array(analyser.frequencyBinCount);
    lpNode=lp;

    src.connect(hp);hp.connect(lp);lp.connect(gain);gain.connect(analyser);

    running=true;peakEnv=0.02;
    lamp.classList.add('on');
    statusEl.textContent='Listening · '+Math.round(audio.sampleRate/1000)+' kHz';
    power.textContent='Stop listening';
    power.classList.add('on');
    sizeCanvas();
    loop();
    if('wakeLock' in navigator){navigator.wakeLock.request('screen').catch(()=>{});}
  }

  function stop(){
    running=false;sounding=false;
    cancelAnimationFrame(rafId);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(audio) audio.close();
    audio=null;analyser=null;stream=null;
    lamp.classList.remove('on');
    statusEl.textContent='Microphone off';
    power.textContent='Start listening';
    power.classList.remove('on');
    holdUntil=0;idle();
    levelEl.style.width='0';
    ctx2d.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
  }

  function setMode(m){
    mode=m;
    document.getElementById('mGuitar').setAttribute('aria-pressed',m==='guitar');
    document.getElementById('mWide').setAttribute('aria-pressed',m==='wide');
    if(lpNode) lpNode.frequency.value=MODES[m].lp;
    history.length=0;sounding=false;
  }
  document.getElementById('mGuitar').addEventListener('click',()=>setMode('guitar'));
  document.getElementById('mWide').addEventListener('click',()=>setMode('wide'));

  power.addEventListener('click',()=>running?stop():start());
  el('refUp').addEventListener('click',()=>{A4=Math.min(466,A4+1);refVal.textContent='A '+A4;});
  el('refDown').addEventListener('click',()=>{A4=Math.max(415,A4-1);refVal.textContent='A '+A4;});
  document.addEventListener('gesturestart',e=>e.preventDefault());

  sizeCanvas();
})();
</script>
</body>
</html>
